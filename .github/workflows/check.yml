name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test

  # Workflow evals are agent-driven (agent-browser skill over CDP), not a
  # headless CI runner — see docs/agentic-ux-testing.md. There is intentionally
  # no e2e job here.
